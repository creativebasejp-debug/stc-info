{
  "services": [
    {
      "type": "web",
      "name": "stc-info",
      "runtime": "static",
      "buildCommand": "mkdir -p dist && for f in *; do case \"$f\" in dist|render.yaml|README.md) ;; *) cp -R \"$f\" dist/ ;; esac; done",
      "staticPublishPath": "dist",
      "autoDeployTrigger": "off",
      "routes": [
        {
          "type": "rewrite",
          "source": "/privacy",
          "destination": "/privacy.html"
        },
        {
          "type": "rewrite",
          "source": "/support",
          "destination": "/support.html"
        },
        {
          "type": "rewrite",
          "source": "/dojo/privacy",
          "destination": "/dojo/privacy.html"
        },
        {
          "type": "rewrite",
          "source": "/dojo/support",
          "destination": "/dojo/support.html"
        }
      ],
      "headers": [
        {
          "path": "/*",
          "name": "X-Content-Type-Options",
          "value": "nosniff"
        },
        {
          "path": "/*",
          "name": "Referrer-Policy",
          "value": "no-referrer"
        },
        {
          "path": "/*",
          "name": "Content-Security-Policy",
          "value": "default-src 'none'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
        }
      ]
    }
  ]
}
